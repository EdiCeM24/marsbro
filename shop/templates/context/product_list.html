{% block content %}
   <!-- PRODUCT LIST -->
<h1 class="text-2xl font-bold mb-4">Products</h1>
<div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
  {% for product in products %}
  <div class="bg-white rounded-2xl shadow p-4">
    <img src="{{ product.image.url }}" class="h-48 w-full object-cover rounded-xl">
    <h2 class="font-semibold mt-2">{{ product.name }}</h2>
    <p class="text-gray-500">₦{{ product.get_price }}</p>

    <div class="flex justify-between mt-3">
      <a href="{{ product.get_absolute_url }}" class="text-blue-500">View</a>
      <a href="{% url 'add_to_cart' product.id %}" class="bg-blue-500 text-white px-3 py-1 rounded">Add</a>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock content %}
