<!-- ORDERS PAGE -->
{% extends 'base.html' %} {% block content %}
<h1 class="text-2xl font-bold mb-4">Your Orders</h1>

{% for order in orders %}
<div class="bg-white p-4 rounded-xl shadow mb-3">
  <p>Order #{{ order.id }}</p>
  <p>Status: {{ order.status }}</p>
  <p>Total: ₦{{ order.get_total }}</p>
</div>
{% endfor %} {% endblock %}

<i class="fa fa-bars" aria-hidden="true"></i>
<i class="fa fa-upload" aria-hidden="true"></i>
<i class="fa fa-trash" aria-hidden="true"></i>
<i class="fa fa-cog" aria-hidden="true"></i>
<i class="fa fa-times" aria-hidden="true"></i>
<i class="fa fa-heart" aria-hidden="true"></i>
<i class="fa fa-heart-o" aria-hidden="true"></i>
<i class="fa fa-eye" aria-hidden="true"></i>
<i class="fa fa-eye-slash" aria-hidden="true"></i>
<i class="fa-brands fa-instagram"></i>
<i class="fa-brands fa-github"></i>
<i class="fa-brands fa-google"></i>
<i class="fa-brands fa-facebook"></i>
<i class="fa-brands fa-linkedin"></i>

<!-- PRODUCT DETAIL -->

<div class="grid md:grid-cols-2 gap-6">
  <img src="{{ product.product_image.url }}" class="rounded-2xl" />

  <div>
    <h1 class="text-3xl font-bold">{{ product.name }}</h1>
    <p class="text-xl text-green-600 mt-2">₦{{ product.get_price }}</p>
    <p class="mt-4 text-gray-600">{{ product.desc }}</p>

    <a
      href="{% url 'add_to_cart' product.id %}"
      class="mt-6 inline-block bg-blue-600 text-white px-6 py-2 rounded-xl"
      >Add to Cart</a
    >
  </div>
</div>
