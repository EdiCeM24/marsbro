{% load static %}

<div class="header" id="myHeader">
  <div class="navbar" id="nav_Links">
    <div class="Logo">
      <a href="{% url 'home' %}" class="myLogo">
        <img src="{% static 'images/favicon3.ico' %}" alt="MarsBro" />
        <span class="myLogo-text">MarsBro</span>
      </a>
    </div>

    <div class="mobile_sidebar" id="header-mobile">
      <div class="navbar-search">
        <form
          action="{% url 'search_products' %}"
          method="get"
          class="search-form"
        >
          {% csrf_token %}
          <input
            type="search"
            name="q"
            placeholder="Search..."
            id="searchInput"
          />
          <button type="submit" class="search-btn">
            <img src="{% static 'images/search-icon.png' %}" alt="" />
          </button>
        </form>
      </div>

      <div class="header_middle_links">
        <div class="nav-parmalinks" id="parma-links">
          <a href="{% url 'products' %}">🛍️ Shopping</a>
          <button
            class="resources-links"
            id="perma-btn"
            style="font-size: 24px; font-weight: 600"
          >
            Resources
          </button>

          <span class="menu-nav-links" id="perma-links">
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'contact' %}">Contact</a>
            <a href="{% url 'wishlist' %}" class="hover:text-blue-500"
              >Wishlist</a
            >
          </span>
        </div>
        <!-- <a href="" class="text-xl font-bold">🛍️ Store</a> -->
      </div>

      <div class="header-conns"></div>

      <div class="auth">
        {% if user.is_authenticated %}
        <a href="{% url 'account_logout' %}">Logout</a>
        {% else %}
        <div class="auth-reg-login">
          <a href="{% url 'login' %}" class="login-btn">Login</a>
          <a href="{% url 'register' %}" class="register">Register</a>
        </div>
        {% endif %}
      </div>
    </div>

    <div class="navbar_profile_btn_auth_unit">
      <div class="mobile-nav">
        <button class="nav-btn" id="navbar-btn">-></button>
      </div>

      <div class="cart_profile">
        <div class="cart-icon">
          <a href="{% url 'cart' %}" class="cart">
            <span class="quantity-update" id="cart-count">0</span>
            <img id="" src="{% static 'images/cart.png' %}" alt="" />
            <!-- <i class="fa fa-cart"></i> -->
          </a>
        </div>

        <div class="image-pos">
          {% if user.is_authenticated %}
          <img src="{{ user.profile_picture.url }}" alt="" />
          {% else %}
          <p>Hi</p>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const loginBtn = document.querySelector(".login-btn");

  loginBtn.addEventListener("click", loginAsk);
  function loginAsk() {
    if (loginBtn) return alert("Are you sure you want to login again?");
  }

  const registerBtn = document.querySelector(".register");

  registerBtn.addEventListener("click", registerAsk);
  function registerAsk() {
    if (registerBtn) return alert("Are you sure you want to register again?");
  }
</script>

{% if user.is_authenticated %}
<a href="{% url 'account_login' %}">Login</a>
{% else %}
<a href="{% url 'account_logout' %}">Logout</a>
{% endif %}

<script>
  const navbarBtnEl = document.getElementById("navbar-btn");
  const headerMobileEl = document.getElementById("header-mobile");

  navbarBtnEl.addEventListener("click", () => {
    if (headerMobileEl.classList.contains("hidden")) {
      headerMobileEl.classList.remove("hidden");
      headerMobileEl.classList.add("show");
    } else {
      headerMobileEl.classList.remove("show");
      headerMobileEl.classList.add("hidden");
    }
  });

  // Nested menu navbar
  const permaBtn = document.querySelector("#perma-btn");
  const permaLinks = document.querySelector("#perma-links");
  const permaMultiLinks = document.querySelectorAll("#perma-links a");

  permaBtn.addEventListener("click", dropmenu);

  function dropmenu() {
    if (permaLinks) {
      permaLinks.classList.toggle("show-nav-menu");
    }
  }

  permaMultiLinks.forEach((link) => {
    link.addEventListener("click", () => {
      permaLinks.classList.remove("show-nav-menu");
    });
  });

  document.addEventListener("click", (e) => {
    if (!permaBtn.contains(e.target) && !permaLinks.contains(e.target)) {
      permaLinks.classList.remove("show-nav-menu");
    }
  });

  // CART COUNT
  const cartCountEl = document.getElementById("cart-count");

  function updateCartCount(count) {
    cartCountEl.textContent = count;
  }

  // Call this function when a product is added to cart
  function addToCart(productId) {
    // Your add to cart logic here
    (console.log(productId),
      fetch(`/cart/add/${productId}`, {
        method: "POST",
        headers: {
          "X-CSRFToken": "{{ csrf_token }}",
        },
      })
        .then((response) => response.json())
        .then((data) => {
          updateCartCount(data.cart_count);
        }));
  }

  //
  document.addEventListener("DOMContentLoaded", () => {
    fetch(`/cart/add/`, {
      method: "GET",
    })
      .then((response) => response.json())
      .then((data) => {
        updateCartCount(data.cart_count);
      });
    console.log(`/cart/add/`);
  });
</script>
